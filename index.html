<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#11100e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="JLG Habits">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<title>JLG HABITS JOURNAL</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,700;1,9..144,400&family=Instrument+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Barlow+Condensed:ital,wght@0,500;0,700;1,400&family=IBM+Plex+Mono:ital,wght@0,500;0,700;1,400&display=swap" rel="stylesheet">
<style>
/* Layout: one phone-width column on neutral greys; serif date on top, one card per habit with its own week, tab bar pinned below. Single dark theme by choice. */
:root{
  --bg:#11100e; --surface:#1a1815; --raise:#25221c; --ink:#efe6d6; --muted:#978d7a; --line:#322d25;
  --accent:#d9b97c; --accent-ink:#1b1610; --dim:#7b6843; --done:#d9b97c; --warn:#e8a15a; --warn-soft:#33230f;
  --display:"Fraunces",Georgia,"Times New Roman",serif;
  --body:"Instrument Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.4;-webkit-text-size-adjust:100%}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{max-width:560px;margin:0 auto;padding:20px 16px 104px;display:flex;flex-direction:column;gap:18px}
.note{background:var(--warn-soft);color:var(--warn);border-radius:10px;padding:10px 12px;font-size:14px;margin:0}
.eyebrow{margin:0 0 4px;font-size:13px;letter-spacing:.22em;text-transform:lowercase;color:var(--muted)}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance;line-height:1.05;text-transform:lowercase}
h1{font-size:42px;font-weight:700;color:var(--accent);letter-spacing:-.01em}
h3{font-size:26px;font-weight:500}
em{font-family:var(--display);font-style:italic}
.num{font-family:var(--display);font-variant-numeric:tabular-nums}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px}
.row.end{align-items:flex-end}

.head{display:flex;flex-direction:column;gap:10px}
.daynav{display:flex;align-items:center;gap:6px}
.nav{width:40px;height:40px;border:0;background:transparent;color:var(--muted);font-size:24px;line-height:1;border-radius:50%;margin-left:-12px}
.nav + .wkday + .nav{margin-left:0}
.nav:disabled{opacity:.3;cursor:default}
.wkday{letter-spacing:.3em;text-transform:lowercase;color:var(--muted);font-size:15px}
.const{color:var(--muted);font-size:16px;white-space:nowrap}
.state{color:var(--accent);font-size:20px;white-space:nowrap;padding-bottom:4px}
.rule{height:4px;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.prog{display:flex;align-items:center;gap:14px}
.prog .bar{flex:1}
.prog .num{font-weight:700;color:var(--accent);font-size:18px;min-width:3.2ch;text-align:right}
.bar{height:6px;border-radius:3px;background:var(--line);overflow:hidden}
.bar u{display:block;height:100%;background:var(--accent);border-radius:3px;transition:width .25s}

.list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:18px;display:flex;flex-direction:column;gap:16px}
.card.met{border-color:var(--dim)}
.hname{display:flex;flex-direction:column;gap:2px;min-width:0}
.hname h3{overflow-wrap:anywhere}
.sub,.streak{font-family:var(--display);font-style:italic;color:var(--muted);font-size:17px}
.orb{flex:none;width:60px;height:60px;border-radius:50%;border:1.5px solid var(--dim);background:transparent;color:var(--accent);font-size:26px;line-height:1;display:grid;place-items:center}
.orb.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:700}
.wk{display:grid;grid-template-columns:repeat(7,1fr)}
.d{border:0;background:transparent;padding:4px 0;display:flex;flex-direction:column;align-items:center;gap:8px;border-radius:8px}
.d i{width:18px;height:18px;border-radius:50%;display:grid;place-items:center}
.d i::after{content:"";width:6px;height:6px;border-radius:50%;background:var(--line)}
.d.part i::after{width:10px;height:10px;background:var(--dim)}
.d.met i::after{width:16px;height:16px;background:var(--accent)}
.d.sel i{box-shadow:0 0 0 1.5px var(--accent)}
.d small{font-family:var(--display);font-size:14px;color:var(--muted)}
.d.sel small{color:var(--ink)}
.d:disabled{opacity:.35;cursor:default}
.foot{align-items:flex-end}
.tools{display:flex;gap:8px;flex-wrap:wrap}
.chip{height:36px;border-radius:18px;border:1px solid var(--line);background:var(--raise);color:var(--muted);padding:0 14px;font-size:14px;font-variant-numeric:tabular-nums}
.chip:disabled{opacity:.35;cursor:default}
.chip.on{border-color:var(--accent);color:var(--ink)}
.run{color:var(--muted);font-family:var(--display);white-space:nowrap}
.run b{font-size:32px;font-weight:700;color:var(--accent);margin-right:4px;line-height:1}
.empty{color:var(--muted);text-align:center;padding:28px 8px;margin:0}
.primary{height:48px;border-radius:24px;border:0;background:var(--accent);color:var(--accent-ink);font-weight:600;padding:0 20px}
.ghost{height:44px;border-radius:22px;border:1px solid var(--line);background:transparent;font-weight:500;padding:0 16px}
.danger{height:44px;border-radius:22px;border:1px solid var(--warn);background:transparent;color:var(--warn);font-weight:500;padding:0 16px}

.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--raise);border-radius:12px;padding:10px}
.stat .num{font-size:28px;font-weight:700;line-height:1;color:var(--accent)}
.stat small{display:block;color:var(--muted);font-size:12px;margin-top:4px}
.grid{display:grid;grid-auto-flow:column;grid-template-rows:repeat(7,1fr);gap:4px}
.grid span{aspect-ratio:1;border-radius:50%;background:var(--line)}
.grid .l1{background:var(--dim)}
.grid .l2{background:var(--accent)}
.grid .fut{background:transparent}
.legend{display:flex;gap:14px;align-items:center;font-size:12px;color:var(--muted);flex-wrap:wrap;margin:0}
.legend i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:5px;vertical-align:-1px}

.mrow{display:flex;align-items:center;gap:8px}
.mrow .hname{flex:1}
.mini{width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--raise);color:var(--muted)}
.mini:disabled{opacity:.35;cursor:default}

.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--bg);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
.tabs div{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr)}
.tabs a{padding:16px 0 18px;text-align:center;text-decoration:none;color:var(--muted);font-family:var(--display);font-style:italic;font-size:17px;text-transform:lowercase;border-top:2px solid transparent;margin-top:-1px}
.tabs a.on{color:var(--accent);border-top-color:var(--accent)}

dialog{border:1px solid var(--line);border-radius:22px;background:var(--surface);color:var(--ink);padding:20px;width:min(92vw,420px)}
dialog::backdrop{background:rgba(6,5,4,.7)}
dialog form{display:flex;flex-direction:column;gap:14px}
label{display:flex;flex-direction:column;gap:6px;font-size:13px;color:var(--muted)}
input,select{height:48px;border-radius:12px;border:1px solid var(--line);background:var(--bg);padding:0 12px;font-size:16px;color:var(--ink);width:100%}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.actions{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.actions .danger{margin-right:auto}
.err{color:var(--warn);font-size:13px;margin:0}
.tally{flex:none;max-width:70%}
.tally line{stroke:var(--accent);stroke-width:2.6;stroke-linecap:round}
.stats.two{grid-template-columns:repeat(2,1fr)}
.tot{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.tot li{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding:10px 0;border-top:1px solid var(--line)}
.tot li:first-child{border-top:0;padding-top:0}
.tot span{font-family:var(--display);font-size:19px;text-transform:lowercase;overflow-wrap:anywhere}
.tot b{color:var(--accent);font-size:19px;white-space:nowrap}
.small{margin:0;color:var(--muted);font-size:14px}
textarea{border-radius:12px;border:1px solid var(--line);background:var(--bg);padding:10px 12px;font:inherit;font-size:14px;color:var(--ink);width:100%;resize:vertical}
[hidden]{display:none!important}
@media (max-width:380px){h1{font-size:36px}.state{font-size:17px}}
@media (prefers-reduced-motion:reduce){.bar u{transition:none}}
</style>
</head>
<body>
<main class="app" id="app"><p class="empty">Cargando tus hábitos…</p></main>

<nav class="tabs" aria-label="Secciones"><div>
  <a href="#hoy" id="tab-hoy">día</a>
  <a href="#historial" id="tab-historial">Historial</a>
  <a href="#habitos" id="tab-habitos">Hábitos</a>
  <a href="#perfil" id="tab-perfil">Perfil</a>
</div></nav>

<dialog id="dlg-val">
  <form id="form-val">
    <h3 id="val-title">Valor</h3>
    <label for="val-input"><span id="val-label">Cantidad</span>
      <input id="val-input" type="number" inputmode="decimal" min="0" step="any" required>
    </label>
    <div class="actions">
      <button type="button" class="ghost" data-a="close-val">Cancelar</button>
      <button type="submit" class="primary">Guardar</button>
    </div>
  </form>
</dialog>

<dialog id="dlg-habit">
  <form id="form-habit">
    <h3 id="hf-title">Nuevo hábito</h3>
    <label for="hf-name">Nombre
      <input id="hf-name" type="text" maxlength="40" required placeholder="Leer, meditar, estirar…">
    </label>
    <label for="hf-type">Cómo se registra
      <select id="hf-type">
        <option value="count">Cantidad con meta diaria</option>
        <option value="check">Sí o no</option>
      </select>
    </label>
    <div class="two" id="hf-countfields">
      <label for="hf-goal">Meta diaria
        <input id="hf-goal" type="number" inputmode="decimal" min="0" step="any">
      </label>
      <label for="hf-unit">Unidad
        <input id="hf-unit" type="text" maxlength="12" placeholder="min, L, pasos">
      </label>
    </div>
    <label for="hf-step" id="hf-steplabel">Cuánto suma cada toque del botón +
      <input id="hf-step" type="number" inputmode="decimal" min="0" step="any">
    </label>
    <p class="err" id="hf-err" hidden></p>
    <div class="actions">
      <button type="button" class="danger" id="hf-del" data-a="del-habit" hidden>Eliminar</button>
      <button type="button" class="ghost" data-a="close-habit">Cancelar</button>
      <button type="submit" class="primary">Guardar</button>
    </div>
  </form>
</dialog>

<dialog id="dlg-name">
  <form id="form-name">
    <h3>tu nombre</h3>
    <label for="pf-name">Cómo quieres que aparezca en tu perfil
      <input id="pf-name" type="text" maxlength="30">
    </label>
    <div class="actions">
      <button type="button" class="ghost" data-a="close-name">Cancelar</button>
      <button type="submit" class="primary">Guardar</button>
    </div>
  </form>
</dialog>

<dialog id="dlg-restore">
  <form id="form-restore">
    <h3>restaurar respaldo</h3>
    <label for="bk-text">Pega aquí el texto de un respaldo. Reemplaza todos los datos de esta copia de la app.
      <textarea id="bk-text" rows="6"></textarea>
    </label>
    <p class="err" id="bk-err" hidden></p>
    <div class="actions">
      <button type="button" class="ghost" data-a="close-restore">Cerrar</button>
      <button type="submit" class="danger" id="bk-go">Reemplazar mis datos</button>
    </div>
  </form>
</dialog>

<script>
(function(){
"use strict";
var $ = function(id){ return document.getElementById(id); };
var app = $("app");
var esc = function(s){ return String(s).replace(/[&<>"']/g, function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]; }); };
var fmt = function(n){ return Number(n).toLocaleString("es-MX",{maximumFractionDigits:2}); };
var r2 = function(n){ return Math.round(n*100)/100; };
var clone = function(o){ return JSON.parse(JSON.stringify(o)); };

/* ---------- dates ---------- */
function keyOf(d){ return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
function parse(k){ var p=k.split("-"); return new Date(+p[0],+p[1]-1,+p[2]); }
function addDays(k,n){ var d=parse(k); d.setDate(d.getDate()+n); return keyOf(d); }
function today(){ return keyOf(new Date()); }
function monday(k){ var d=parse(k); var w=(d.getDay()+6)%7; return addDays(k,-w); }

/* ---------- state ---------- */
var S = { habits:[], profile:{}, days:{}, sel:today(), view:"hoy", cfgLoaded:false, note:"", saveErr:"", bkMsg:"" };
var framed = (function(){ try{ return window.self!==window.top; }catch(e){ return true; } })();
var LOCAL = !(window.claude && window.claude.use) && !framed;
var LKEY = "bitacora-habitos-v1";
function loadLocal(){
  try{
    var o = JSON.parse(localStorage.getItem(LKEY)||"null");
    if(o){ S.habits=Array.isArray(o.habits)?o.habits:[]; S.profile=o.profile||{}; S.days=o.days||{}; }
  }catch(e){ S.note="Este navegador no permite guardar datos; los cambios no se conservarán."; }
  S.cfgLoaded = true;
}
function persistLocal(){
  try{ localStorage.setItem(LKEY, JSON.stringify({habits:S.habits, profile:S.profile, days:S.days})); if(S.saveErr){ S.saveErr=""; } }
  catch(e){ S.saveErr="No se pudo guardar en este dispositivo."; }
}
var db = null, cfgRef = null, daysCol = null;
var editing = null, valFor = null, delArmed = false;

function val(h,k){ var d=S.days[k]; return d ? (Number(d[h.id])||0) : 0; }
function ratio(h,k){ var v=val(h,k); if(h.type==="check") return v>=1?1:0; return h.goal>0 ? Math.min(1,v/h.goal) : (v>0?1:0); }
function met(h,k){ return ratio(h,k)>=1; }
function metCount(k){ var n=0; S.habits.forEach(function(h){ if(met(h,k)) n++; }); return n; }
function streak(h){
  var k=today(), n=0;
  if(!met(h,k)) k=addDays(k,-1);
  while(met(h,k)){ n++; k=addDays(k,-1); }
  return n;
}
function bestStreak(h){
  var keys=Object.keys(S.days).sort(); if(!keys.length) return 0;
  var k=keys[0], end=today(), best=0, run=0, guard=0;
  while(k<=end && guard++<4000){ if(met(h,k)){ run++; if(run>best) best=run; } else run=0; k=addDays(k,1); }
  return best;
}
function pct30(h){
  var end=today(), start=addDays(end,-29);
  if(h.since && h.since>start) start=h.since;
  var k=start, total=0, ok=0;
  while(k<=end && total<31){ total++; if(met(h,k)) ok++; k=addDays(k,1); }
  return total ? Math.round(ok/total*100) : 0;
}

/* ---------- saving: one write at a time per document, bursts coalesced ---------- */
var pend = {};
function pending(key){ var p=pend[key]; return !!p && (p.dirty||p.busy); }
function save(key, ref, getData){
  if(LOCAL){ persistLocal(); return; }
  if(!ref) return;
  var p = pend[key] || (pend[key]={dirty:false,busy:false,timer:0});
  p.dirty = true;
  clearTimeout(p.timer);
  p.timer = setTimeout(function(){ flush(p, ref, getData); }, 500);
}
function wait(ms){ return new Promise(function(r){ setTimeout(r,ms); }); }
async function flush(p, ref, getData){
  if(p.busy) return;
  p.busy = true;
  while(p.dirty){
    p.dirty = false;
    try{
      try{ await ref.set(getData()); }
      catch(e){
        if(e && e.code==="unavailable"){ await wait(700+Math.random()*600); await ref.set(getData()); }
        else throw e;
      }
      if(S.saveErr){ S.saveErr=""; render(); }
    }catch(e){
      var code = e && e.code;
      S.saveErr = code==="quota_exceeded" ? "No se guardó el último cambio: el almacenamiento de la app está lleno."
        : code==="invalid_argument" ? "No se guardó el último cambio: esta vista no tiene permiso de escritura."
        : "No se guardó el último cambio. Revisa tu conexión y vuelve a intentarlo.";
      render();
    }
  }
  p.busy = false;
}
function saveCfg(){ save("cfg", cfgRef, function(){ return {habits: clone(S.habits), profile: clone(S.profile||{})}; }); }
function saveDay(k){ save("d:"+k, daysCol ? daysCol.doc(k) : null, function(){ return {v: clone(S.days[k]||{})}; }); }

function setVal(h,k,v){
  v = Math.max(0, r2(Number(v)||0));
  var d = Object.assign({}, S.days[k]||{});
  d[h.id] = v;
  S.days[k] = d;
  saveDay(k);
  render();
}

/* ---------- views ---------- */
function notes(){
  var out="";
  if(S.note) out+='<p class="note">'+esc(S.note)+'</p>';
  if(S.saveErr) out+='<p class="note">'+esc(S.saveErr)+'</p>';
  return out;
}
function dayStreak(){
  var any=function(k){ return metCount(k)>0; };
  var k=today(), n=0;
  if(!any(k)) k=addDays(k,-1);
  while(any(k) && n<4000){ n++; k=addDays(k,-1); }
  return n;
}
var WD = ["l","m","m","j","v","s","d"];
function viewHoy(){
  var k=S.sel, t=today(), d=parse(k), n=S.habits.length, m=metCount(k);
  var wk = k===t ? "hoy · "+d.toLocaleDateString("es-MX",{weekday:"long"}) : d.toLocaleDateString("es-MX",{weekday:"long"});
  var ds=dayStreak(), sum=0;
  S.habits.forEach(function(x){ sum+=ratio(x,k); });
  var pct = n ? Math.round(sum/n*100) : 0;
  var state = !n ? "" : m===n ? "día completo" : m+" de "+n;
  var h = notes();
  h += '<header class="head"><div class="row"><div class="daynav"><button class="nav" data-a="prev" aria-label="Día anterior">‹</button>'
    + '<span class="wkday">'+esc(wk)+'</span>'
    + '<button class="nav" data-a="next" aria-label="Día siguiente"'+(k>=t?' disabled':'')+'>›</button></div>'
    + '<em class="const">'+(ds>0 ? 'constancia · '+ds+(ds===1?' día':' días') : 'empieza hoy')+'</em></div>'
    + '<div class="row end"><h1>'+esc(d.toLocaleDateString("es-MX",{day:"numeric",month:"long"}))+'</h1><em class="state">'+state+'</em></div>'
    + '<div class="rule"></div>'
    + '<div class="prog"><div class="bar"><u style="width:'+pct+'%"></u></div><span class="num">'+pct+'%</span></div></header>';
  if(!S.cfgLoaded){ return h+'<p class="empty">Cargando tus hábitos…</p>'; }
  if(!n){
    return h+'<div class="card"><p class="empty">Todavía no hay hábitos en tu bitácora.</p><button class="primary" data-a="new-habit">Crear el primer hábito</button></div>';
  }
  var mon=monday(k);
  h += '<ul class="list">';
  S.habits.forEach(function(x){
    var v=val(x,k), ok=met(x,k), st=streak(x), count=x.type!=="check";
    var u = x.unit ? ' '+esc(x.unit) : '';
    var sub = count ? fmt(v)+' / '+fmt(x.goal)+u : (ok?'hecho':'pendiente');
    h += '<li class="card'+(ok?' met':'')+'"><div class="row"><div class="hname"><h3>'+esc(x.name)+'</h3><em class="sub">'+sub+'</em></div>';
    if(count){
      h += '<button class="orb'+(ok?' on':'')+'" data-a="inc" data-id="'+x.id+'" aria-label="Sumar '+fmt(x.step)+u+' a '+esc(x.name)+'">'+(ok?'✓':'+')+'</button></div>';
    }else{
      h += '<button class="orb'+(ok?' on':'')+'" data-a="toggle" data-id="'+x.id+'" aria-pressed="'+ok+'" aria-label="Marcar '+esc(x.name)+'">'+(ok?'✓':'')+'</button></div>';
    }
    h += '<div class="wk">';
    for(var i=0;i<7;i++){
      var dk=addDays(mon,i), r=ratio(x,dk);
      h += '<button class="d'+(r>=1?' met':r>0?' part':'')+(dk===k?' sel':'')+'" data-a="pick" data-k="'+dk+'"'+(dk>t?' disabled':'')
        + ' aria-label="'+esc(parse(dk).toLocaleDateString("es-MX",{weekday:"long",day:"numeric"}))+'"><i></i><small>'+WD[i]+'</small></button>';
    }
    h += '</div>';
    if(count){
      h += '<div class="tools"><button class="chip" data-a="dec" data-id="'+x.id+'"'+(v<=0?' disabled':'')+'>− '+fmt(x.step)+'</button>'
        + '<button class="chip" data-a="edit-val" data-id="'+x.id+'">escribir total</button></div>';
    }
    h += '<div class="row foot">'+tally(st)+'<div class="run">'+(st>0 ? '<b class="num">'+st+'</b>'+(st===1?'día':'días') : '')+'</div></div></li>';
  });
  return h+'</ul>';
}
function tally(n){
  var show=Math.min(n,20);
  if(!show) return '<span class="run">sin racha</span>';
  var g=Math.ceil(show/5), w=g*44, s='<svg class="tally" viewBox="0 0 '+w+' 30" width="'+w+'" height="30" role="img" aria-label="Racha de '+n+' días">';
  for(var i=0;i<show;i++){
    var x0=Math.floor(i/5)*44, j=i%5;
    if(j<4){ var x=x0+6+j*8, tilt=((i*7)%3)-1; s+='<line x1="'+(x+tilt)+'" y1="3" x2="'+(x-tilt)+'" y2="27"/>'; }
    else s+='<line x1="'+(x0+1)+'" y1="23" x2="'+(x0+36)+'" y2="7"/>';
  }
  return s+'</svg>';
}
function bestDayStreak(){
  var keys=Object.keys(S.days).sort(); if(!keys.length) return 0;
  var k=keys[0], end=today(), best=0, run=0, guard=0;
  while(k<=end && guard++<4000){ if(metCount(k)>0){ run++; if(run>best) best=run; } else run=0; k=addDays(k,1); }
  return best;
}
function backupText(){ return JSON.stringify({app:"bitacora-habitos", v:1, habits:S.habits, profile:S.profile, days:S.days}); }
function viewPerfil(){
  var keys=Object.keys(S.days).sort(), t=today(), n=S.habits.length, logged=0, full=0, kept=0, first="";
  keys.forEach(function(k){
    if(k>t) return;
    var d=S.days[k], has=false;
    for(var id in d){ if(Number(d[id])>0){ has=true; break; } }
    if(!has) return;
    if(!first) first=k;
    logged++;
    var m=metCount(k); kept+=m; if(n && m===n) full++;
  });
  var name = S.profile && S.profile.name ? S.profile.name : "";
  var h = notes()+'<div class="row end"><div><p class="eyebrow">tu bitácora</p><h1>'+esc(name||"perfil")+'</h1></div>'
    + '<button class="ghost" data-a="edit-name">'+(name?'cambiar nombre':'poner mi nombre')+'</button></div>';
  h += '<em class="sub">'+(first ? logged+(logged===1?' día':' días')+' con registro desde el '+esc(parse(first).toLocaleDateString("es-MX",{day:"numeric",month:"long",year:"numeric"})) : 'aún no hay días registrados')+'</em>';
  h += '<div class="stats two">'
    + '<div class="stat"><span class="num">'+dayStreak()+'</span><small>días de constancia actual</small></div>'
    + '<div class="stat"><span class="num">'+bestDayStreak()+'</span><small>mejor constancia</small></div>'
    + '<div class="stat"><span class="num">'+full+'</span><small>días completos</small></div>'
    + '<div class="stat"><span class="num">'+kept+'</span><small>metas cumplidas</small></div></div>';
  if(n){
    h += '<div class="card"><h3>acumulado</h3><ul class="tot">';
    S.habits.forEach(function(x){
      var sum=0, times=0;
      keys.forEach(function(k){ var v=val(x,k); sum+=v; if(met(x,k)) times++; });
      var right = x.type==="check" ? times+(times===1?' vez':' veces') : fmt(r2(sum))+(x.unit?' '+esc(x.unit):'');
      h += '<li><span>'+esc(x.name)+'</span><b class="num">'+right+'</b></li>';
    });
    h += '</ul></div>';
  }
  h += '<div class="card"><h3>tipografía</h3><p class="small">Prueba cada una; el cambio se ve al instante y se guarda.</p><div class="tools">';
  Object.keys(FONTS).forEach(function(f){
    h += '<button class="chip'+(fontKey()===f?' on':'')+'" data-a="font" data-f="'+f+'" aria-pressed="'+(fontKey()===f)+'" style="font-family:'+esc(FONTS[f].css)+'">'+FONTS[f].label+'</button>';
  });
  h += '</div></div>';
  h += '<div class="card"><h3>respaldo</h3><p class="small">'+(LOCAL ? 'Tus datos se guardan solo en este dispositivo. Copia un respaldo de vez en cuando.' : 'Tus datos se guardan en tu cuenta de Claude. El respaldo sirve para pasarlos a otra copia de la app.')+'</p>'
    + '<div class="tools"><button class="ghost" data-a="copy-backup">copiar respaldo</button><button class="ghost" data-a="open-restore">restaurar</button></div>'
    + (S.bkMsg ? '<p class="small">'+esc(S.bkMsg)+'</p>' : '')+'</div>';
  return h;
}
function applyBackup(o){
  var old=Object.keys(S.days);
  S.habits = clone(o.habits);
  S.profile = o.profile && typeof o.profile==="object" ? clone(o.profile) : {};
  S.days = clone(o.days);
  old.forEach(function(k){ if(!S.days[k]) S.days[k]={}; });
  saveCfg();
  Object.keys(S.days).forEach(saveDay);
}
function viewHist(){
  var h = notes()+'<div><p class="eyebrow">Últimas 12 semanas</p><h1>Historial</h1></div>';
  if(!S.habits.length) return h+'<p class="empty">Cuando registres hábitos, aquí verás tus rachas y tu constancia.</p>';
  var t=today(), start=addDays(monday(t),-77);
  h += '<p class="legend"><span><i style="background:var(--done)"></i>Meta cumplida</span><span><i style="background:var(--dim)"></i>Avance parcial</span><span><i style="background:var(--line)"></i>Sin registro</span></p><ul class="list">';
  S.habits.forEach(function(x){
    h += '<li class="card"><h3>'+esc(x.name)+'</h3><div class="stats">'
      + '<div class="stat"><span class="num">'+streak(x)+'</span><small>racha actual</small></div>'
      + '<div class="stat"><span class="num">'+bestStreak(x)+'</span><small>mejor racha</small></div>'
      + '<div class="stat"><span class="num">'+pct30(x)+'%</span><small>últimos 30 días</small></div></div><div class="grid">';
    for(var i=0;i<84;i++){
      var dk=addDays(start,i);
      if(dk>t){ h+='<span class="fut"></span>'; continue; }
      var r=ratio(x,dk);
      h += '<span class="'+(r>=1?'l2':r>0?'l1':'')+'" title="'+dk+': '+fmt(val(x,dk))+'"></span>';
    }
    h += '</div></li>';
  });
  return h+'</ul>';
}
function viewHabits(){
  var h = notes()+'<div><p class="eyebrow">Qué registras cada día</p><h1>Hábitos</h1></div>';
  if(!S.cfgLoaded) return h+'<p class="empty">Cargando tus hábitos…</p>';
  h += '<ul class="list">';
  S.habits.forEach(function(x,i){
    var sub = x.type==="check" ? "Sí o no" : "Meta: "+fmt(x.goal)+(x.unit?" "+esc(x.unit):"")+" al día";
    h += '<li class="card"><div class="mrow"><div class="hname"><h3>'+esc(x.name)+'</h3><span class="streak">'+sub+'</span></div>'
      + '<button class="mini" data-a="up" data-id="'+x.id+'" aria-label="Subir '+esc(x.name)+'"'+(i===0?' disabled':'')+'>↑</button>'
      + '<button class="mini" data-a="down" data-id="'+x.id+'" aria-label="Bajar '+esc(x.name)+'"'+(i===S.habits.length-1?' disabled':'')+'>↓</button>'
      + '<button class="ghost" data-a="edit-habit" data-id="'+x.id+'">Editar</button></div></li>';
  });
  h += '</ul><button class="primary" data-a="new-habit">Nuevo hábito</button>';
  return h;
}
var FONTS = {
  serif:{label:"serif", css:'"Fraunces",Georgia,"Times New Roman",serif'},
  sans:{label:"moderna", css:'"Instrument Sans",system-ui,-apple-system,sans-serif'},
  cond:{label:"condensada", css:'"Barlow Condensed","Arial Narrow",Arial,sans-serif'},
  mono:{label:"máquina", css:'"IBM Plex Mono",ui-monospace,Menlo,monospace'}
};
function fontKey(){ var f=S.profile && S.profile.font; return FONTS[f] ? f : "serif"; }
function render(){
  document.documentElement.style.setProperty("--display", FONTS[fontKey()].css);
  app.innerHTML = S.view==="historial" ? viewHist() : S.view==="habitos" ? viewHabits() : S.view==="perfil" ? viewPerfil() : viewHoy();
  ["hoy","historial","habitos","perfil"].forEach(function(v){ $("tab-"+v).classList.toggle("on", S.view===v); });
}
function route(){
  var v = location.hash.replace("#","");
  S.view = (v==="historial"||v==="habitos"||v==="perfil") ? v : "hoy";
  render();
}
window.addEventListener("hashchange", route);

/* ---------- dialogs ---------- */
function find(id){ for(var i=0;i<S.habits.length;i++) if(S.habits[i].id===id) return S.habits[i]; return null; }
function syncType(){
  var c = $("hf-type").value==="count";
  $("hf-countfields").hidden = !c; $("hf-steplabel").hidden = !c;
}
$("hf-type").addEventListener("change", syncType);
function openHabit(h){
  editing = h ? h.id : null; delArmed = false;
  $("hf-title").textContent = h ? "Editar hábito" : "Nuevo hábito";
  $("hf-name").value = h ? h.name : "";
  $("hf-type").value = h ? h.type : "count";
  $("hf-goal").value = h && h.type==="count" ? h.goal : "";
  $("hf-unit").value = h ? (h.unit||"") : "";
  $("hf-step").value = h && h.type==="count" ? h.step : "";
  $("hf-del").hidden = !h; $("hf-del").textContent = "Eliminar";
  $("hf-err").hidden = true;
  syncType();
  $("dlg-habit").showModal();
}
$("form-habit").addEventListener("submit", function(ev){
  ev.preventDefault();
  var name=$("hf-name").value.trim(), type=$("hf-type").value;
  var goal=Number($("hf-goal").value), step=Number($("hf-step").value), unit=$("hf-unit").value.trim();
  var err="";
  if(!name) err="Escribe un nombre para el hábito.";
  else if(type==="count" && !(goal>0)) err="Escribe una meta diaria mayor que cero.";
  if(err){ $("hf-err").textContent=err; $("hf-err").hidden=false; return; }
  if(type==="count" && !(step>0)) step = goal>=100 ? r2(goal/10) : 1;
  var data = type==="check" ? {name:name,type:"check"} : {name:name,type:"count",goal:r2(goal),unit:unit,step:r2(step)};
  if(editing){
    var h=find(editing);
    if(h){ var keep={id:h.id,since:h.since}; var i=S.habits.indexOf(h); S.habits[i]=Object.assign(keep,data); }
  }else{
    S.habits.push(Object.assign({id:"h"+Date.now().toString(36), since:today()}, data));
  }
  saveCfg(); $("dlg-habit").close(); render();
});
var restoreArmed = false;
$("form-name").addEventListener("submit", function(ev){
  ev.preventDefault();
  S.profile = Object.assign({}, S.profile||{}, {name: $("pf-name").value.trim()});
  saveCfg(); $("dlg-name").close(); render();
});
$("form-restore").addEventListener("submit", function(ev){
  ev.preventDefault();
  var o=null;
  try{ o=JSON.parse($("bk-text").value); }catch(e){}
  if(!o || !Array.isArray(o.habits) || !o.days || typeof o.days!=="object" || Array.isArray(o.days)){
    $("bk-err").textContent="Ese texto no es un respaldo de esta app. Pega el texto completo que copiaste."; $("bk-err").hidden=false; return;
  }
  if(!restoreArmed){ restoreArmed=true; $("bk-go").textContent="Confirmar: reemplazar todo"; return; }
  applyBackup(o); S.bkMsg="Respaldo restaurado."; $("dlg-restore").close(); render();
});
$("form-val").addEventListener("submit", function(ev){
  ev.preventDefault();
  var h=find(valFor.id);
  if(h) setVal(h, valFor.k, $("val-input").value);
  $("dlg-val").close();
});

document.addEventListener("click", function(ev){
  var el = ev.target.closest("[data-a]"); if(!el) return;
  var a=el.dataset.a, h=el.dataset.id ? find(el.dataset.id) : null, k=S.sel, i;
  if(a==="prev"){ S.sel=addDays(k,-1); render(); }
  else if(a==="next"){ if(k<today()){ S.sel=addDays(k,1); render(); } }
  else if(a==="pick"){ S.sel=el.dataset.k; render(); }
  else if(a==="toggle" && h){ setVal(h,k, met(h,k)?0:1); }
  else if(a==="inc" && h){ setVal(h,k, val(h,k)+h.step); }
  else if(a==="dec" && h){ setVal(h,k, val(h,k)-h.step); }
  else if(a==="edit-val" && h){
    valFor={id:h.id,k:k};
    $("val-title").textContent=h.name;
    $("val-label").textContent="Total del día"+(h.unit?" ("+h.unit+")":"");
    $("val-input").value = val(h,k) || "";
    $("dlg-val").showModal(); $("val-input").focus(); $("val-input").select();
  }
  else if(a==="close-val"){ $("dlg-val").close(); }
  else if(a==="font"){ S.profile = Object.assign({}, S.profile||{}, {font: el.dataset.f}); saveCfg(); render(); }
  else if(a==="edit-name"){ $("pf-name").value = (S.profile&&S.profile.name)||""; $("dlg-name").showModal(); }
  else if(a==="close-name"){ $("dlg-name").close(); }
  else if(a==="copy-backup"){
    var txt = backupText();
    var fail = function(){ $("bk-text").value=txt; $("bk-err").hidden=true; $("dlg-restore").showModal(); $("bk-text").select(); S.bkMsg="No se pudo copiar automáticamente: copia el texto del cuadro."; render(); };
    try{ navigator.clipboard.writeText(txt).then(function(){ S.bkMsg="Respaldo copiado. Pégalo en tus notas para guardarlo."; render(); }, fail); }catch(e){ fail(); }
  }
  else if(a==="open-restore"){ restoreArmed=false; $("bk-text").value=""; $("bk-err").hidden=true; $("bk-go").textContent="Reemplazar mis datos"; $("dlg-restore").showModal(); }
  else if(a==="close-restore"){ $("dlg-restore").close(); }
  else if(a==="new-habit"){ openHabit(null); }
  else if(a==="edit-habit" && h){ openHabit(h); }
  else if(a==="close-habit"){ $("dlg-habit").close(); }
  else if(a==="del-habit"){
    if(!delArmed){ delArmed=true; el.textContent="Confirmar: eliminar"; return; }
    S.habits = S.habits.filter(function(x){ return x.id!==editing; });
    saveCfg(); $("dlg-habit").close(); render();
  }
  else if((a==="up"||a==="down") && h){
    i=S.habits.indexOf(h); var j=a==="up"?i-1:i+1;
    if(j>=0 && j<S.habits.length){ S.habits[i]=S.habits[j]; S.habits[j]=h; saveCfg(); render(); }
  }
});

/* ---------- storage ---------- */
function start(){
  if(LOCAL){ loadLocal(); route(); return; }
  route();
  var slow = setTimeout(function(){
    S.note = S.cfgLoaded ? "No se pudo confirmar con el guardado; lo que ves puede estar desactualizado." : "Aún no se pueden leer tus datos guardados. Se mostrarán en cuanto haya conexión.";
    render();
  }, 10000);
  var settle = function(){ clearTimeout(slow); if(S.note){ S.note=""; } };
  if(!window.claude || !window.claude.use){ offline(slow); return; }
  window.claude.use("db").then(function(d){
    if(!d){ offline(slow); return; }
    db=d; cfgRef=db.doc("app/config"); daysCol=db.collection("days");
    var onErr = function(){ settle(); S.cfgLoaded=true; S.note="Se perdió la conexión con el guardado. Vuelve a abrir la app para seguir registrando."; render(); };
    cfgRef.onSnapshot(function(snap){
      if(!pending("cfg")){
        var data = snap.exists ? snap.data() : null;
        S.habits = data && Array.isArray(data.habits) ? clone(data.habits) : [];
        S.profile = data && data.profile && typeof data.profile==="object" ? clone(data.profile) : {};
      }
      S.cfgLoaded = true;
      if(!snap.metadata || !snap.metadata.fromCache) settle();
      render();
    }, onErr);
    daysCol.onSnapshot(function(qs){
      qs.docs.forEach(function(doc){
        if(pending("d:"+doc.id)) return;
        var data = doc.data();
        S.days[doc.id] = data && data.v ? clone(data.v) : {};
      });
      render();
    }, onErr);
  }, function(){ offline(slow); });
}
function offline(slow){
  clearTimeout(slow);
  S.cfgLoaded = true;
  S.note = "El guardado no está disponible en esta vista. Puedes probar la app, pero los cambios no se conservarán.";
  render();
}
start();
})();
</script>
</body>
