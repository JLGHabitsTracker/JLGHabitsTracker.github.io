<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#11100e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="JLG Habits">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<title>JLG HABITS JOURNAL</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,700;1,9..144,400&family=Instrument+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Barlow+Condensed:ital,wght@0,500;0,700;1,400&family=IBM+Plex+Mono:ital,wght@0,500;0,700;1,400&family=Bebas+Neue&family=Oswald:wght@500;700&family=Archivo:ital,wght@0,500;0,700;1,400&family=DM+Serif+Display:ital@0;1&display=swap" rel="stylesheet">
<style>
/* Layout: one phone-width column on warm black; serif date on top, one card per habit with icon, week dots and tally marks; tab bar pinned below. Single dark theme by choice; accent swappable from the profile. */
:root{
  --bg:#11100e; --surface:#1a1815; --raise:#25221c; --ink:#efe6d6; --muted:#978d7a; --line:#322d25;
  --accent:#d9b97c; --accent-ink:#1b1610; --dim:#7b6843; --warn:#e8a15a; --warn-soft:#33230f;
  --display:"Fraunces",Georgia,"Times New Roman",serif;
  --body:"Instrument Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.4;-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{max-width:560px;margin:0 auto;padding:calc(20px + env(safe-area-inset-top)) 16px 110px;display:flex;flex-direction:column;gap:18px}
.note{background:var(--warn-soft);color:var(--warn);border-radius:12px;padding:12px;font-size:14px;margin:0}
.note.bk{display:flex;flex-direction:column;gap:10px}
.note.bk .chip{color:var(--warn);border-color:var(--warn);background:transparent}
.note.ok{background:var(--raise);color:var(--ink)}
.eyebrow{margin:0 0 4px;font-size:13px;letter-spacing:.22em;text-transform:lowercase;color:var(--muted)}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance;line-height:1.05;text-transform:lowercase}
h1{font-size:42px;font-weight:700;color:var(--accent);letter-spacing:-.01em}
h2{font-size:30px;font-weight:700}
h3{font-size:24px;font-weight:500}
em{font-family:var(--display);font-style:italic}
.num{font-family:var(--display);font-variant-numeric:tabular-nums}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px}
.row.end{align-items:flex-end}
.small{margin:0;color:var(--muted);font-size:14px}

.head{display:flex;flex-direction:column;gap:10px}
.daynav{display:flex;align-items:center;gap:6px}
.nav{width:40px;height:40px;border:0;background:transparent;color:var(--muted);font-size:24px;line-height:1;border-radius:50%}
.nav:first-child{margin-left:-12px}
.nav:disabled{opacity:.3;cursor:default}
.wkday{letter-spacing:.3em;text-transform:lowercase;color:var(--muted);font-size:15px}
.const{color:var(--muted);font-size:16px;white-space:nowrap}
.state{color:var(--accent);font-size:20px;white-space:nowrap;padding-bottom:4px}
.rule{height:4px;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.prog{display:flex;align-items:center;gap:14px}
.prog .bar{flex:1}
.prog .num{font-weight:700;color:var(--accent);font-size:18px;min-width:3.2ch;text-align:right}
.bar{height:6px;border-radius:3px;background:var(--line);overflow:hidden}
.bar u{display:block;height:100%;background:var(--accent);border-radius:3px;transition:width .25s}

.list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:18px;display:flex;flex-direction:column;gap:16px}
.card.met{border-color:var(--dim)}
.hrow{display:flex;align-items:center;gap:14px}
.ico{flex:none;width:52px;height:52px;border-radius:16px;background:var(--raise);color:var(--accent);display:grid;place-items:center}
.ico svg{width:26px;height:26px}
.hname{display:flex;flex-direction:column;gap:2px;min-width:0;flex:1}
.hname h3{overflow-wrap:anywhere}
.sub{font-family:var(--display);font-style:italic;color:var(--muted);font-size:17px}
.orb{flex:none;width:58px;height:58px;border-radius:50%;border:1.5px solid var(--dim);background:transparent;color:var(--accent);font-size:26px;line-height:1;display:grid;place-items:center}
.orb.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:700}
.wk{display:grid;grid-template-columns:repeat(7,1fr)}
.d{border:0;background:transparent;padding:4px 0;display:flex;flex-direction:column;align-items:center;gap:8px;border-radius:8px}
.d i{width:18px;height:18px;border-radius:50%;display:grid;place-items:center}
.d i::after{content:"";width:6px;height:6px;border-radius:50%;background:var(--line)}
.d.part i::after{width:10px;height:10px;background:var(--dim)}
.d.met i::after{width:16px;height:16px;background:var(--accent)}
.d.sel i{box-shadow:0 0 0 1.5px var(--accent)}
.d small{font-family:var(--display);font-size:14px;color:var(--muted)}
.d.sel small{color:var(--ink)}
.d:disabled{opacity:.35;cursor:default}
.foot{align-items:flex-end}
.tools{display:flex;gap:8px;flex-wrap:wrap}
.chip{height:36px;border-radius:18px;border:1px solid var(--line);background:var(--raise);color:var(--muted);padding:0 14px;font-size:14px;font-variant-numeric:tabular-nums}
.chip:disabled{opacity:.35;cursor:default}
.chip.on{border-color:var(--accent);color:var(--ink)}
.run{color:var(--muted);font-family:var(--display);white-space:nowrap}
.run b{font-size:32px;font-weight:700;color:var(--accent);margin-right:4px;line-height:1}
.tally{flex:none;max-width:70%}
.tally line{stroke:var(--accent);stroke-width:2.6;stroke-linecap:round}
.empty{color:var(--muted);text-align:center;padding:28px 8px;margin:0}
.primary{height:48px;border-radius:24px;border:0;background:var(--accent);color:var(--accent-ink);font-weight:600;padding:0 20px}
.ghost{height:44px;border-radius:22px;border:1px solid var(--line);background:transparent;font-weight:500;padding:0 16px}
.danger{height:44px;border-radius:22px;border:1px solid var(--warn);background:transparent;color:var(--warn);font-weight:500;padding:0 16px}

.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stats.two{grid-template-columns:repeat(2,1fr)}
.stat{background:var(--raise);border-radius:12px;padding:10px}
.stat .num{font-size:28px;font-weight:700;line-height:1;color:var(--accent)}
.stat small{display:block;color:var(--muted);font-size:12px;margin-top:4px}
.grid{display:grid;grid-auto-flow:column;grid-template-rows:repeat(7,1fr);gap:4px}
.grid span{aspect-ratio:1;border-radius:50%;background:var(--line)}
.grid .l1{background:var(--dim)}
.grid .l2{background:var(--accent)}
.grid .fut{background:transparent}
.legend{display:flex;gap:14px;align-items:center;font-size:12px;color:var(--muted);flex-wrap:wrap;margin:0}
.legend i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:5px;vertical-align:-1px}

.mrow{display:flex;align-items:center;gap:10px}
.mini{width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--raise);color:var(--muted)}
.mini:disabled{opacity:.35;cursor:default}

.who{display:flex;align-items:center;gap:16px}
.avatar{flex:none;width:84px;height:84px;border-radius:50%;border:1.5px solid var(--dim);background:var(--raise);color:var(--accent);display:grid;place-items:center;overflow:hidden;padding:0;font-family:var(--display);font-size:34px;font-weight:700;text-transform:uppercase}
.avatar img{width:100%;height:100%;object-fit:cover;display:block}
.who .hname h2{color:var(--accent)}
.meta{display:flex;flex-direction:column;gap:2px;font-size:14px;color:var(--muted);overflow-wrap:anywhere}
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.badge{display:flex;align-items:center;gap:10px;background:var(--raise);border-radius:14px;padding:10px;opacity:.4}
.badge.got{opacity:1}
.badge .ico{width:40px;height:40px;border-radius:12px;background:var(--bg)}
.badge .ico svg{width:20px;height:20px}
.badge b{display:block;font-size:14px;font-weight:600}
.badge small{display:block;color:var(--muted);font-size:12px}
.tot{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.tot li{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding:10px 0;border-top:1px solid var(--line)}
.tot li:first-child{border-top:0;padding-top:0}
.tot span{font-family:var(--display);font-size:19px;text-transform:lowercase;overflow-wrap:anywhere}
.tot b{color:var(--accent);font-size:19px;white-space:nowrap}
.swatches{display:flex;gap:10px;flex-wrap:wrap}
.sw{width:44px;height:44px;border-radius:50%;border:2px solid transparent;padding:4px;background:transparent}
.sw span{display:block;width:100%;height:100%;border-radius:50%}
.sw.on{border-color:var(--ink)}
.setrow{display:flex;flex-direction:column;gap:8px}
.setrow > span{font-size:13px;color:var(--muted)}

.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--bg);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
.tabs div{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr)}
.tabs a{padding:16px 0 18px;text-align:center;text-decoration:none;color:var(--muted);font-family:var(--display);font-style:italic;font-size:17px;text-transform:lowercase;border-top:2px solid transparent;margin-top:-1px}
.tabs a.on{color:var(--accent);border-top-color:var(--accent)}

dialog{border:1px solid var(--line);border-radius:22px;background:var(--surface);color:var(--ink);padding:20px;width:min(92vw,440px);max-height:88vh;overflow:auto}
dialog::backdrop{background:rgba(6,5,4,.7)}
dialog form{display:flex;flex-direction:column;gap:14px}
label{display:flex;flex-direction:column;gap:6px;font-size:13px;color:var(--muted)}
input,select{height:48px;border-radius:12px;border:1px solid var(--line);background:var(--bg);padding:0 12px;font-size:16px;color:var(--ink);width:100%}
input[type=file]{height:auto;padding:10px 12px}
textarea{border-radius:12px;border:1px solid var(--line);background:var(--bg);padding:10px 12px;font-size:14px;color:var(--ink);width:100%;resize:vertical}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.actions{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.actions .danger{margin-right:auto}
.err{color:var(--warn);font-size:13px;margin:0}
fieldset{border:0;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
legend{font-size:13px;color:var(--muted);padding:0;margin-bottom:6px}
.icopick{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
.icopick label{display:block;cursor:pointer}
.icopick input{position:absolute;opacity:0;width:1px;height:1px}
.icopick span{display:grid;place-items:center;aspect-ratio:1;border-radius:12px;background:var(--raise);color:var(--muted);border:1.5px solid transparent}
.icopick svg{width:22px;height:22px}
.icopick input:checked + span{border-color:var(--accent);color:var(--accent)}
.icopick input:focus-visible + span{outline:2px solid var(--accent);outline-offset:2px}
.photo img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:18px;display:block}
label.checkrow{flex-direction:row;align-items:center;gap:10px;font-size:15px;color:var(--ink)}
input[type=checkbox]{width:22px;height:22px;flex:none;padding:0;accent-color:var(--accent)}
.tot li .chip{flex:none}
.quote{margin:4px 0 0;padding-left:14px;border-left:2px solid var(--dim);color:var(--ink);font-size:19px;line-height:1.3;text-wrap:balance}
#splash{position:fixed;inset:0;background:var(--bg);display:grid;place-items:center;z-index:50;animation:spOut .35s ease 1.55s forwards}
#splash div{display:flex;flex-direction:column;align-items:center;gap:18px}
#splash line{stroke:var(--accent);stroke-width:7;stroke-linecap:round;stroke-dasharray:110;stroke-dashoffset:110;animation:spDraw .26s ease-out forwards}
#splash line:nth-child(1){animation-delay:.10s}#splash line:nth-child(2){animation-delay:.22s}#splash line:nth-child(3){animation-delay:.34s}#splash line:nth-child(4){animation-delay:.46s}#splash line:nth-child(5){animation-delay:.64s;animation-duration:.32s}
#splash b{font-family:var(--display);font-size:26px;font-weight:700;color:var(--accent);opacity:0;animation:spIn .4s ease .9s forwards}
@keyframes spDraw{to{stroke-dashoffset:0}}
@keyframes spIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@keyframes spOut{to{opacity:0;visibility:hidden}}
@media (prefers-reduced-motion:reduce){#splash{display:none}}
[hidden]{display:none!important}
@media (max-width:380px){h1{font-size:36px}.state{font-size:17px}.ico{width:46px;height:46px}.orb{width:52px;height:52px}}
@media (prefers-reduced-motion:reduce){.bar u{transition:none}}
</style>
</head>
<body>
<div id="splash" aria-hidden="true"><div>
  <svg viewBox="0 0 120 100" width="132" height="110"><line x1="34" y1="18" x2="34" y2="82"/><line x1="50" y1="18" x2="50" y2="82"/><line x1="66" y1="18" x2="66" y2="82"/><line x1="82" y1="18" x2="82" y2="82"/><line x1="14" y1="72" x2="106" y2="30"/></svg>
  <b>jlg habits journal</b>
</div></div>
<main class="app" id="app"><p class="empty">Cargando tus hábitos…</p></main>

<nav class="tabs" aria-label="Secciones"><div>
  <a href="#hoy" id="tab-hoy">día</a>
  <a href="#historial" id="tab-historial">historial</a>
  <a href="#habitos" id="tab-habitos">hábitos</a>
  <a href="#perfil" id="tab-perfil">perfil</a>
</div></nav>

<dialog id="dlg-val">
  <form id="form-val">
    <h3 id="val-title">valor</h3>
    <label for="val-input"><span id="val-label">Cantidad</span>
      <input id="val-input" type="number" inputmode="decimal" min="0" step="any" required>
    </label>
    <div class="actions">
      <button type="button" class="ghost" data-a="close" data-d="dlg-val">Cancelar</button>
      <button type="submit" class="primary">Guardar</button>
    </div>
  </form>
</dialog>

<dialog id="dlg-habit">
  <form id="form-habit">
    <h3 id="hf-title">nuevo hábito</h3>
    <label for="hf-name">Nombre
      <input id="hf-name" type="text" maxlength="40" required placeholder="Leer, meditar, gym…">
    </label>
    <fieldset>
      <legend>Ícono</legend>
      <div class="icopick" id="hf-icons"></div>
    </fieldset>
    <label for="hf-type">Cómo se registra
      <select id="hf-type">
        <option value="count">Cantidad con meta diaria</option>
        <option value="check">Sí o no, cada día</option>
        <option value="week">Veces por semana</option>
      </select>
    </label>
    <div class="two" id="hf-countfields">
      <label for="hf-goal"><span id="hf-goallabel">Meta diaria</span>
        <input id="hf-goal" type="number" inputmode="decimal" min="0" step="any">
      </label>
      <label for="hf-unit" id="hf-unitlabel">Unidad
        <input id="hf-unit" type="text" maxlength="12" placeholder="min, L, pasos">
      </label>
    </div>
    <label for="hf-step" id="hf-steplabel">Cuánto suma cada toque del botón +
      <input id="hf-step" type="number" inputmode="decimal" min="0" step="any">
    </label>
    <p class="err" id="hf-err" hidden></p>
    <div class="actions">
      <button type="button" class="danger" id="hf-del" data-a="del-habit" hidden>Eliminar</button>
      <button type="button" class="ghost" data-a="close" data-d="dlg-habit">Cancelar</button>
      <button type="submit" class="primary">Guardar</button>
    </div>
  </form>
</dialog>

<dialog id="dlg-profile">
  <form id="form-profile">
    <h3>editar perfil</h3>
    <label for="pf-name">Nombre
      <input id="pf-name" type="text" maxlength="30" autocomplete="name">
    </label>
    <label for="pf-email">Correo
      <input id="pf-email" type="email" maxlength="80" autocomplete="email" placeholder="tu@correo.com">
    </label>
    <p class="small" id="pf-emailnote"></p>
    <label for="pf-photo">Foto de perfil
      <input id="pf-photo" type="file" accept="image/*">
    </label>
    <p class="err" id="pf-err" hidden></p>
    <div class="actions">
      <button type="button" class="danger" data-a="del-photo" id="pf-delphoto">Quitar foto</button>
      <button type="button" class="ghost" data-a="close" data-d="dlg-profile">Cancelar</button>
      <button type="submit" class="primary">Guardar</button>
    </div>
  </form>
</dialog>

<dialog id="dlg-restore">
  <form id="form-restore">
    <h3>restaurar respaldo</h3>
    <label for="bk-file">Elige el archivo de respaldo que guardaste
      <input id="bk-file" type="file" accept=".json,application/json,text/plain">
    </label>
    <label for="bk-text">O pega aquí el texto del respaldo. Reemplaza todos los datos de esta copia de la app.
      <textarea id="bk-text" rows="5"></textarea>
    </label>
    <p class="err" id="bk-err" hidden></p>
    <div class="actions">
      <button type="button" class="ghost" data-a="close" data-d="dlg-restore">Cerrar</button>
      <button type="submit" class="danger" id="bk-go">Reemplazar mis datos</button>
    </div>
  </form>
</dialog>

<dialog id="dlg-photo">
  <form method="dialog" class="photo">
    <img id="ph-img" alt="Foto de perfil">
    <div class="actions">
      <button type="button" class="ghost" data-a="photo-edit">Cambiar foto</button>
      <button type="button" class="primary" data-a="close" data-d="dlg-photo">Cerrar</button>
    </div>
  </form>
</dialog>
<dialog id="dlg-rem">
  <form id="form-rem">
    <h3>recordatorio</h3>
    <label for="rm-time">Hora
      <input id="rm-time" type="time" required>
    </label>
    <label for="rm-habit">Sobre qué
      <select id="rm-habit"></select>
    </label>
    <label for="rm-pending" class="checkrow">
      <input id="rm-pending" type="checkbox"> Avisar solo si aún no lo cumplo
    </label>
    <p class="err" id="rm-err" hidden></p>
    <div class="actions">
      <button type="button" class="danger" id="rm-del" data-a="rem-del" hidden>Eliminar</button>
      <button type="button" class="ghost" data-a="close" data-d="dlg-rem">Cancelar</button>
      <button type="submit" class="primary">Guardar</button>
    </div>
  </form>
</dialog>
<dialog id="dlg-login">
  <form id="form-login">
    <h3>tu cuenta</h3>
    <p class="small">Con tu cuenta, tus datos se guardan en la nube y los ves en el iPhone, la compu o donde entres.</p>
    <label for="lg-email">Correo
      <input id="lg-email" type="email" maxlength="80" autocomplete="email" inputmode="email" placeholder="tu@correo.com">
    </label>
    <label for="lg-pass">Contraseña (mínimo 8 caracteres)
      <input id="lg-pass" type="password" maxlength="72" autocomplete="current-password">
    </label>
    <p class="err" id="lg-err" hidden></p>
    <p class="note ok" id="lg-msg" hidden></p>
    <div class="actions">
      <button type="button" class="ghost" data-a="close" data-d="dlg-login">Cancelar</button>
      <button type="button" class="ghost" id="lg-new">Crear cuenta</button>
      <button type="submit" class="primary" id="lg-go">Entrar</button>
    </div>
  </form>
</dialog>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
(function(){
"use strict";
var VERSION = "1.14";
var $ = function(id){ return document.getElementById(id); };
(function(){
  var sp=$("splash"), seen=false;
  try{ seen=!!sessionStorage.getItem("jlg-splash"); sessionStorage.setItem("jlg-splash","1"); }catch(e){}
  if(seen){ sp.remove(); return; }
  setTimeout(function(){ sp.remove(); }, 2000);
})();
var app = $("app");
var esc = function(s){ return String(s).replace(/[&<>"']/g, function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]; }); };
var fmt = function(n){ return Number(n).toLocaleString("es-MX",{maximumFractionDigits:2}); };
var r2 = function(n){ return Math.round(n*100)/100; };
var clone = function(o){ return JSON.parse(JSON.stringify(o)); };
var plain = function(s){ return String(s||"").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"").trim(); };

/* ---------- dates ---------- */
function keyOf(d){ return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
function parse(k){ var p=k.split("-"); return new Date(+p[0],+p[1]-1,+p[2]); }
function addDays(k,n){ var d=parse(k); d.setDate(d.getDate()+n); return keyOf(d); }
function today(){ return keyOf(new Date()); }
function monday(k){ var d=parse(k); var w=(d.getDay()+6)%7; return addDays(k,-w); }
function longDate(k,opts){ return parse(k).toLocaleDateString("es-MX",opts||{day:"numeric",month:"long",year:"numeric"}); }

function isWeek(h){ return h.type==="week"; }
function val(h,k){ var d=S.days[k]; return d ? (Number(d[h.id])||0) : 0; }
function ratio(h,k){ var v=val(h,k); if(h.type!=="count") return v>=1?1:0; return h.goal>0 ? Math.min(1,v/h.goal) : (v>0?1:0); }
function met(h,k){ return ratio(h,k)>=1; }
function weekCount(h,k){ var m=monday(k), n=0; for(var i=0;i<7;i++) if(val(h,addDays(m,i))>=1) n++; return n; }
function weekMet(h,mon){ return weekCount(h,mon) >= (h.goal||1); }
function metCount(k){ var n=0; S.habits.forEach(function(h){ if(met(h,k)) n++; }); return n; }
function streak(h){
  var n=0, g=0;
  if(isWeek(h)){
    var m=monday(today());
    if(!weekMet(h,m)) m=addDays(m,-7);
    while(weekMet(h,m) && g++<1000){ n++; m=addDays(m,-7); }
    return n;
  }
  var k=today();
  if(!met(h,k)) k=addDays(k,-1);
  while(met(h,k) && g++<4000){ n++; k=addDays(k,-1); }
  return n;
}
function firstKey(){ var ks=Object.keys(S.days).sort(); return ks[0]||today(); }
function bestStreak(h){
  var best=0, run=0, g=0, end=today();
  if(isWeek(h)){
    var m=monday(firstKey());
    while(m<=end && g++<1000){ if(weekMet(h,m)){ run++; if(run>best) best=run; } else if(m<monday(end)) run=0; m=addDays(m,7); }
    return best;
  }
  var k=firstKey();
  while(k<=end && g++<4000){ if(met(h,k)){ run++; if(run>best) best=run; } else run=0; k=addDays(k,1); }
  return best;
}
function consistency(h){
  if(isWeek(h)){
    var m=monday(today()), ok=0;
    for(var i=0;i<4;i++){ if(weekMet(h,addDays(m,-7*i))) ok++; }
    return {v:ok+"/4", l:"semanas cumplidas de 4"};
  }
  var end=today(), start=addDays(end,-29);
  if(h.since && h.since>start) start=h.since;
  var k=start, total=0, good=0;
  while(k<=end && total<31){ total++; if(met(h,k)) good++; k=addDays(k,1); }
  return {v:(total?Math.round(good/total*100):0)+"%", l:"últimos 30 días"};
}
function dayScore(k){
  var n=0, m=0, sum=0;
  S.habits.forEach(function(h){
    if(isWeek(h) && !met(h,k)) return;
    n++; var r=ratio(h,k); sum+=r; if(r>=1) m++;
  });
  return {n:n, m:m, pct:n?Math.round(sum/n*100):0};
}
function dayStreak(){
  var k=today(), n=0;
  if(!metCount(k)) k=addDays(k,-1);
  while(metCount(k)>0 && n<4000){ n++; k=addDays(k,-1); }
  return n;
}
function bestDayStreak(){
  var k=firstKey(), end=today(), best=0, run=0, g=0;
  while(k<=end && g++<4000){ if(metCount(k)>0){ run++; if(run>best) best=run; } else run=0; k=addDays(k,1); }
  return best;
}

/* ---------- saving ---------- */
function loadLocal(){
  try{
    var o = JSON.parse(localStorage.getItem(LKEY)||"null");
    if(o){ S.habits=Array.isArray(o.habits)?o.habits:[]; S.profile=o.profile||{}; S.days=o.days||{}; }
  }catch(e){ S.note="Este navegador no permite guardar datos; los cambios no se conservarán."; }
  S.cfgLoaded = true;
}
function persistLocal(){
  try{ localStorage.setItem(LKEY, JSON.stringify({habits:S.habits, profile:S.profile, days:S.days})); if(S.saveErr){ S.saveErr=""; } }
  catch(e){ S.saveErr="No se pudo guardar en este dispositivo. Si subiste una foto muy pesada, quítala."; }
}
var pend = {};
function pending(key){ var p=pend[key]; return !!p && (p.dirty||p.busy); }
function save(key, ref, getData){
  if(LOCAL){ persistLocal(); if(sb && user){ markOut(key); schedulePush(); } return; }
  if(!ref) return;
  var p = pend[key] || (pend[key]={dirty:false,busy:false,timer:0});
  p.dirty = true;
  clearTimeout(p.timer);
  p.timer = setTimeout(function(){ flush(p, ref, getData); }, 500);
}
function wait(ms){ return new Promise(function(r){ setTimeout(r,ms); }); }
async function flush(p, ref, getData){
  if(p.busy) return;
  p.busy = true;
  while(p.dirty){
    p.dirty = false;
    try{
      try{ await ref.set(getData()); }
      catch(e){
        if(e && e.code==="unavailable"){ await wait(700+Math.random()*600); await ref.set(getData()); }
        else throw e;
      }
      if(S.saveErr){ S.saveErr=""; render(); }
    }catch(e){
      var code = e && e.code;
      S.saveErr = code==="quota_exceeded" ? "No se guardó el último cambio: el almacenamiento está lleno."
        : code==="invalid_argument" ? "No se guardó el último cambio: esta vista no tiene permiso de escritura."
        : "No se guardó el último cambio. Revisa tu conexión y vuelve a intentarlo.";
      render();
    }
  }
  p.busy = false;
}
function saveCfg(){ save("cfg", cfgRef, function(){ return {habits: clone(S.habits), profile: clone(S.profile||{})}; }); }
function saveDay(k){ save("d:"+k, daysCol ? daysCol.doc(k) : null, function(){ return {v: clone(S.days[k]||{})}; }); }
function setProfile(patch){ S.profile = Object.assign({}, S.profile||{}, patch); saveCfg(); }

function setVal(h,k,v){
  v = Math.max(0, r2(Number(v)||0));
  var d = Object.assign({}, S.days[k]||{});
  d[h.id] = v;
  S.days[k] = d;
  if(!S.profile.since){ S.profile = Object.assign({}, S.profile, {since: firstKey()<k ? firstKey() : k}); saveCfg(); }
  saveDay(k);
  render();
}

var WD = ["l","m","m","j","v","s","d"];
function tally(n){
  var show=Math.min(n,20);
  if(!show) return '<span class="run">sin racha</span>';
  var w=Math.ceil(show/5)*44, s='<svg class="tally" viewBox="0 0 '+w+' 30" width="'+w+'" height="30" aria-hidden="true">';
  for(var i=0;i<show;i++){
    var x0=Math.floor(i/5)*44, j=i%5;
    if(j<4){ var x=x0+6+j*8, t=((i*7)%3)-1; s+='<line x1="'+(x+t)+'" y1="3" x2="'+(x-t)+'" y2="27"/>'; }
    else s+='<line x1="'+(x0+1)+'" y1="23" x2="'+(x0+36)+'" y2="7"/>';
  }
  return s+'</svg>';
}
function backupDue(){
  if(!LOCAL || !S.habits.length || user) return false;
  var pf=S.profile||{}, t=today();
  if(pf.backupSnooze && pf.backupSnooze>=t) return false;
  return !pf.lastBackup || pf.lastBackup<=addDays(t,-7);
}
function notes(){

  if(backupDue()){
    var lb=(S.profile||{}).lastBackup;
    out+='<div class="note bk"><span>'+(lb ? 'Tu último respaldo fue hace '+Math.round((parse(today())-parse(lb))/864e5)+' días.' : 'Aún no guardas un respaldo de tus datos.')+'</span>'
      +'<div class="tools"><button class="chip on" data-a="share-backup">guardar respaldo</button><button class="chip" data-a="snooze-backup">mañana</button></div></div>';

function viewHoy(){
  var k=S.sel, t=today(), d=parse(k), sc=dayScore(k);
  var wk = k===t ? "hoy · "+d.toLocaleDateString("es-MX",{weekday:"long"}) : d.toLocaleDateString("es-MX",{weekday:"long"});
  var ds=dayStreak();
  var state = !sc.n ? "" : sc.m===sc.n ? "día completo" : sc.m+" de "+sc.n;
  var h = notes();
  h += '<header class="head"><div class="row"><div class="daynav"><button class="nav" data-a="prev" aria-label="Día anterior">‹</button>'
    + '<span class="wkday">'+esc(wk)+'</span>'
    + '<button class="nav" data-a="next" aria-label="Día siguiente"'+(k>=t?' disabled':'')+'>›</button></div>'
    + '<em class="const">'+(ds>0 ? 'constancia · '+ds+(ds===1?' día':' días') : 'empieza hoy')+'</em></div>'
    + '<div class="row end"><h1>'+esc(d.toLocaleDateString("es-MX",{day:"numeric",month:"long"}))+'</h1><em class="state">'+state+'</em></div>'
    + '<div class="rule"></div>'
    + '<div class="prog"><div class="bar"><u style="width:'+sc.pct+'%"></u></div><span class="num">'+sc.pct+'%</span></div>'
    + ((S.profile||{}).quotes!==false ? '<p class="quote"><em>'+esc(quoteFor(k))+'</em></p>' : '')+'</header>';
  if(!S.cfgLoaded){ return h+'<p class="empty">Cargando tus hábitos…</p>'; }

    return h+'<div class="card"><p class="empty">Todavía no hay hábitos en tu bitácora.</p><button class="primary" data-a="new-habit">Crear el primer hábito</button>'+(sb && !user ? '<button class="ghost" data-a="login">Ya tengo cuenta: iniciar sesión</button>' : '')+'</div>';
  }
  var mon=monday(k);
  h += '<ul class="list">';

function stats(){
  var keys=Object.keys(S.days).sort(), t=today(), n=S.habits.length, logged=0, full=0, kept=0, first="";
  keys.forEach(function(k){
    if(k>t) return;
    var d=S.days[k], has=false;
    for(var id in d){ if(Number(d[id])>0){ has=true; break; } }
    if(!has) return;
    if(!first) first=k;
    logged++;
    var m=metCount(k); kept+=m;
    var sc=dayScore(k); if(sc.n && sc.m===sc.n) full++;
  });
  var anyWeek=S.habits.some(function(h){ return isWeek(h) && bestStreak(h)>0; });
  return {logged:logged, full:full, kept:kept, first:first, cur:dayStreak(), best:bestDayStreak(), anyWeek:anyWeek, n:n};
}

function shrinkPhoto(file){
  return new Promise(function(res, rej){
    var url=URL.createObjectURL(file), img=new Image();
    img.onload=function(){
      var S2=640, c=document.createElement("canvas"); c.width=S2; c.height=S2;
      var side=Math.min(img.naturalWidth,img.naturalHeight), sx=(img.naturalWidth-side)/2, sy=(img.naturalHeight-side)/2;
      c.getContext("2d").drawImage(img,sx,sy,side,side,0,0,S2,S2);
      URL.revokeObjectURL(url);
      res(c.toDataURL("image/jpeg",0.82));
    };
    img.onerror=function(){ URL.revokeObjectURL(url); rej(); };
    img.src=url;
  });
}

function backupText(){ return JSON.stringify({app:"bitacora-habitos", v:2, habits:S.habits, profile:S.profile, days:S.days}); }
function markBackup(){ setProfile({lastBackup:today()}); }
function shareBackup(){
  var name="jlg-habitos-"+today()+".json", txt=backupText(), file=null;
  try{ file=new File([txt],name,{type:"application/json"}); }catch(e){}
  var done=function(){ markBackup(); S.bkMsg="Respaldo guardado."; render(); };
  var fallback=function(){ S.bkMsg="Este navegador no deja guardar el archivo; usa copiar respaldo."; render(); };
  var fail=function(e){ if(!e || e.name!=="AbortError") fallback(); };
  try{
    if(file && navigator.canShare && navigator.canShare({files:[file]})) navigator.share({files:[file], title:"Respaldo de hábitos"}).then(done, fail);
    else if(navigator.share) navigator.share({title:"Respaldo de hábitos", text:txt}).then(done, fail);
    else fallback();
  }catch(e){ fallback(); }
}
function applyBackup(o){
  var old=Object.keys(S.days);
  S.habits = clone(o.habits);
  S.profile = o.profile && typeof o.profile==="object" ? clone(o.profile) : {};
  S.days = clone(o.days);
  old.forEach(function(k){ if(!S.days[k]) S.days[k]={}; });
  saveCfg();
  Object.keys(S.days).forEach(saveDay);
}

  if(!o || !Array.isArray(o.habits) || !o.days || typeof o.days!=="object" || Array.isArray(o.days)){
    $("bk-err").textContent="Ese texto no es un respaldo de esta app. Elige el archivo o pega el texto completo."; $("bk-err").hidden=false; return;
  }
  if(!restoreArmed){ restoreArmed=true; $("bk-go").textContent="Confirmar: reemplazar todo"; return; }

});

/* ---------- steps from Health ---------- */
function numberFrom(t){ var m=String(t||"").replace(/[,\s]/g,"").match(/\d+(\.\d+)?/); return m ? Number(m[0]) : NaN; }
function pasteInto(h){
  var k=S.sel;
  var fallback=function(){ S.ok=""; openVal(h,k); };
  try{
    navigator.clipboard.readText().then(function(t){
      var n=numberFrom(t);
      if(!(n>=0)){ fallback(); return; }
      setVal(h,k,n); S.ok="Se registraron "+fmt(n)+(h.unit?" "+h.unit:"")+" en "+h.name+"."; render();
    }, fallback);
  }catch(e){ fallback(); }
}
function processParams(){
  if(paramsDone) return; paramsDone=true;
  var q; try{ q=new URLSearchParams(location.search); }catch(e){ return; }
  var who=q.get("registrar"), v=numberFrom(q.get("valor"));
  if(!who || !(v>=0)) return;
  var w=plain(who), h=null;
  S.habits.forEach(function(x){ if(!h && (x.id===who || plain(x.name)===w || (x.type==="count" && plain(x.unit)===w))) h=x; });
  try{ history.replaceState(null,"",location.pathname+location.hash); }catch(e){}
  if(!h){ S.note="No encontré un hábito llamado “"+who+"”."; render(); return; }
  setVal(h,today(),v); S.ok="Se registraron "+fmt(v)+(h.unit?" "+h.unit:"")+" en "+h.name+" desde el atajo."; render();
}

/* ---------- cloud sync (Supabase) ---------- */
var SB_URL = "https://sbabjzwmosdcvgzlzbiy.supabase.co";
var SB_KEY = "sb_publishable_iI7LR8w1QJwGlh8D5zr1KA_C2I2FIGh";
var sb = null, user = null, OKEY = "bitacora-outbox-v1", out = {cfg:false, days:{}}, pushTimer = 0, syncing = false;
S.sync = ""; S.syncAt = 0;
try{ if(LOCAL && window.supabase && window.supabase.createClient) sb = window.supabase.createClient(SB_URL, SB_KEY, {auth:{persistSession:true, autoRefreshToken:true, detectSessionInUrl:false, storageKey:"jlg-auth"}}); }catch(e){ sb = null; }
function loadOut(){ try{ var o=JSON.parse(localStorage.getItem(OKEY)||"null"); if(o && o.days) out=o; }catch(e){} }
function saveOut(){ try{ localStorage.setItem(OKEY, JSON.stringify(out)); }catch(e){} }
function markOut(key){ if(key==="cfg") out.cfg=true; else if(key.indexOf("d:")===0) out.days[key.slice(2)]=true; saveOut(); }
function schedulePush(){ clearTimeout(pushTimer); pushTimer=setTimeout(function(){ syncNow(false); }, 900); }
function syncLabel(){
  if(!user) return "";
  if(S.sync==="busy") return "Sincronizando…";
  if(S.sync==="err") return "Sin conexión con la nube. Tus cambios se guardan aquí y se suben al volver la conexión.";
  var pend = out.cfg || Object.keys(out.days).length;
  if(pend) return "Hay cambios por subir.";
  return S.syncAt ? "Todo sincronizado." : "";
}
async function pushOut(){
  var sentCfg = out.cfg ? JSON.stringify([S.habits, S.profile]) : null;
  var keys = Object.keys(out.days), sent = {};
  if(sentCfg){
    var r1 = await sb.from("user_config").upsert({user_id:user.id, habits:S.habits, profile:S.profile, updated_at:new Date().toISOString()});
    if(r1.error) throw r1.error;
    if(JSON.stringify([S.habits, S.profile])===sentCfg) out.cfg=false;
  }
  if(keys.length){
    var rows = keys.map(function(k){ sent[k]=JSON.stringify(S.days[k]||{}); return {user_id:user.id, day:k, v:S.days[k]||{}, updated_at:new Date().toISOString()}; });
    for(var i=0;i<rows.length;i+=200){
      var r2 = await sb.from("day_logs").upsert(rows.slice(i,i+200));
      if(r2.error) throw r2.error;
    }
    keys.forEach(function(k){ if(JSON.stringify(S.days[k]||{})===sent[k]) delete out.days[k]; });
  }
  saveOut();
}
async function pullAll(){
  var c = await sb.from("user_config").select("habits,profile").eq("user_id", user.id).maybeSingle();
  if(c.error) throw c.error;
  var d = await sb.from("day_logs").select("day,v").eq("user_id", user.id).range(0, 9999);
  if(d.error) throw d.error;
  return {cfg:c.data, days:d.data||[]};
}
function applyPull(p){
  if(p.cfg && !out.cfg){
    S.habits = Array.isArray(p.cfg.habits) ? p.cfg.habits : [];
    S.profile = p.cfg.profile && typeof p.cfg.profile==="object" ? p.cfg.profile : {};
  }
  p.days.forEach(function(r){ if(!out.days[r.day]) S.days[r.day] = r.v || {}; });
  persistLocal();
}
async function syncNow(pullToo){
  if(!sb || !user || syncing) return;
  syncing = true; S.sync="busy";
  try{
    await pushOut();
    if(pullToo) applyPull(await pullAll());
    S.sync="ok"; S.syncAt=Date.now();
  }catch(e){ S.sync="err"; }
  syncing = false;
  if(!document.querySelector("dialog[open]")) render();
}
async function afterLogin(){
  S.sync="busy"; render();
  try{
    var p = await pullAll();
    if(!p.cfg){
      out.cfg = true;
      Object.keys(S.days).forEach(function(k){ out.days[k]=true; });
      saveOut();
      await pushOut();
      S.ok = S.habits.length ? "Listo: tus hábitos y registros ya están en la nube." : "Sesión iniciada. Crea tus hábitos y se guardarán en la nube.";
    }else{
      try{ if(S.habits.length || Object.keys(S.days).length) localStorage.setItem("bitacora-antes-de-sesion", JSON.stringify({habits:S.habits, profile:S.profile, days:S.days})); }catch(e){}
      S.habits=[]; S.profile={}; S.days={}; out={cfg:false, days:{}}; saveOut();
      applyPull(p);
      S.ok = "Sesión iniciada. Se cargaron tus datos de la nube.";
    }
    if(user.email && S.profile.email!==user.email){ S.profile = Object.assign({}, S.profile, {email:user.email}); markOut("cfg"); persistLocal(); await pushOut(); }
    S.sync="ok"; S.syncAt=Date.now();
  }catch(e){ S.sync="err"; }
  render();
}
function startSync(){
  if(!sb) return;
  loadOut();
  sb.auth.getSession().then(function(r){
    var s = r && r.data && r.data.session;
    if(s && s.user){ user = s.user; syncNow(true); }
  });

    if(ev==="SIGNED_OUT"){ user=null; render(); }
    else if(session && session.user){ user = session.user; }

/* ---------- reminders + push ---------- */
S.pushOn = false; S.pushMsg = "";
var remEditing = null, remDelArmed = false;
function pushSupported(){ return "serviceWorker" in navigator && "PushManager" in window && "Notification" in window; }
function b64u(s){ var p="=".repeat((4-s.length%4)%4), b=atob((s+p).replace(/-/g,"+").replace(/_/g,"/")), a=new Uint8Array(b.length); for(var i=0;i<b.length;i++) a[i]=b.charCodeAt(i); return a; }
function myTz(){ try{ return Intl.DateTimeFormat().resolvedOptions().timeZone || "America/Mexico_City"; }catch(e){ return "America/Mexico_City"; } }
function initPush(){
  if(!LOCAL || !pushSupported()) return;
  navigator.serviceWorker.register("sw.js").then(function(){ return navigator.serviceWorker.ready; }).then(function(reg){ return reg.pushManager.getSubscription(); }).then(function(s){
    S.pushOn = !!s && Notification.permission==="granted";
    if(S.view==="perfil" && !document.querySelector("dialog[open]")) render();
  }).catch(function(){});
}
async function enablePush(){
  try{
    var perm = await Notification.requestPermission();
    if(perm!=="granted"){ S.pushMsg="No diste permiso. Actívalo en Ajustes → Notificaciones → JLG Habits."; render(); return; }
    S.pushMsg="Activando…"; render();
    var reg = await navigator.serviceWorker.ready;
    var r = await sb.functions.invoke("push", {method:"GET"});
    if(r.error || !r.data || !r.data.publicKey) throw new Error("llave");
    var sub = await reg.pushManager.getSubscription();
    if(!sub) sub = await reg.pushManager.subscribe({userVisibleOnly:true, applicationServerKey:b64u(r.data.publicKey)});
    var j = sub.toJSON();
    var up = await sb.from("push_subs").upsert({endpoint:j.endpoint, user_id:user.id, sub:j});
    if(up.error) throw new Error("guardar");
    S.pushOn = true; S.pushMsg = "Notificaciones activadas en este dispositivo.";
    if((S.profile||{}).tz!==myTz()) setProfile({tz:myTz()});
  }catch(e){ S.pushMsg = "No se pudieron activar las notificaciones ("+(e && e.message || "error")+"). Intenta de nuevo."; }
  render();
}
function testPush(){
  S.pushMsg="Enviando…"; render();
  sb.functions.invoke("push", {body:{action:"test"}}).then(function(r){
    var d=r.data||{};
    S.pushMsg = r.error ? "No se pudo enviar la prueba." : d.sent ? "Enviada. Debe llegar en unos segundos; cierra la app para verla." : "No se envió"+(d.errors && d.errors.length ? " (error "+d.errors[0]+")" : ": este dispositivo no está registrado")+". Toca activar otra vez.";
    if(!r.error && !d.sent) S.pushOn=false;
    render();
  }, function(){ S.pushMsg="Sin conexión."; render(); });
}
function remLabel(r){ if(r.habit==="__frase") return "Frase del día"; if(!r.habit) return "Resumen del día"; var h=find(r.habit); return h ? h.name : "Hábito eliminado"; }
function remindersCard(){
  var rs=((S.profile||{}).reminders||[]).slice().sort(function(a,b){ return a.time<b.time?-1:1; });
  var h='<div class="card"><h3>recordatorios</h3>';

  else if(!S.pushOn) h+='<p class="small">Activa las notificaciones en este dispositivo para recibir tus recordatorios.</p><div class="tools"><button class="primary" data-a="push-on">activar notificaciones</button></div>';

    h+='<ul class="tot">';

    h+='</ul>';
  }
  h+='<div class="tools"><button class="ghost" data-a="rem-new">nuevo recordatorio</button></div>'+(S.pushOn ? '' : '<p class="small">Llegan con hasta 5 minutos de margen.</p>')+'</div>';
  return h;
}
function openRem(id){
  var rs=(S.profile||{}).reminders||[], r=null;
  rs.forEach(function(x){ if(x.id===id) r=x; });

  var opts='<option value="">Resumen del día</option><option value="__frase">Frase del día</option>';

$("form-rem").addEventListener("submit", function(ev){
  ev.preventDefault();
  var t=$("rm-time").value;
  if(!/^\d{2}:\d{2}$/.test(t)){ $("rm-err").textContent="Elige una hora."; $("rm-err").hidden=false; return; }
  var rs=((S.profile||{}).reminders||[]).slice();
  var item={id: remEditing || "r"+Date.now().toString(36), time:t, habit:$("rm-habit").value, pending:$("rm-pending").checked};
  rs = rs.filter(function(x){ return x.id!==item.id; }); rs.push(item);
  setProfile({reminders:rs, tz:myTz()}); $("dlg-rem").close(); render();

/* ---------- clicks ---------- */
document.addEventListener("click", function(ev){
  var el = ev.target.closest("[data-a]"); if(!el) return;
  var a=el.dataset.a, h=el.dataset.id ? find(el.dataset.id) : null, k=S.sel, i;
  if(a!=="paste" && S.ok){ S.ok=""; }
  if(a!=="logout") logoutArmed=false;
  if(a==="prev"){ S.sel=addDays(k,-1); render(); }
  else if(a==="next"){ if(k<today()){ S.sel=addDays(k,1); render(); } }
  else if(a==="pick"){ S.sel=el.dataset.k; render(); }
  else if(a==="toggle" && h){ setVal(h,k, met(h,k)?0:1); }
  else if(a==="inc" && h){ setVal(h,k, val(h,k)+h.step); }
  else if(a==="dec" && h){ setVal(h,k, val(h,k)-h.step); }
  else if(a==="edit-val" && h){ openVal(h,k); }
  else if(a==="paste" && h){ pasteInto(h); }
  else if(a==="close"){ $(el.dataset.d).close(); }
  else if(a==="new-habit"){ openHabit(null); }
  else if(a==="edit-habit" && h){ openHabit(h); }
  else if(a==="del-habit"){
    if(!delArmed){ delArmed=true; el.textContent="Confirmar: eliminar"; return; }
    S.habits = S.habits.filter(function(x){ return x.id!==editing; });
    saveCfg(); $("dlg-habit").close(); render();
  }
  else if((a==="up"||a==="down") && h){
    i=S.habits.indexOf(h); var j=a==="up"?i-1:i+1;
    if(j>=0 && j<S.habits.length){ S.habits[i]=S.habits[j]; S.habits[j]=h; saveCfg(); render(); }
  }
  else if(a==="edit-profile"){ openProfile(); }
  else if(a==="login"){ openLogin(); }
  else if(a==="push-on"){ enablePush(); }
  else if(a==="push-test"){ testPush(); }
  else if(a==="rem-new"){ openRem(null); }
  else if(a==="rem-edit"){ openRem(el.dataset.id); }
  else if(a==="rem-del"){
    if(!remDelArmed){ remDelArmed=true; el.textContent="Confirmar: eliminar"; return; }
    setProfile({reminders:((S.profile||{}).reminders||[]).filter(function(x){ return x.id!==remEditing; })}); $("dlg-rem").close(); render();
  }
  else if(a==="view-photo"){ $("ph-img").src=(S.profile||{}).photo||""; $("dlg-photo").showModal(); }
  else if(a==="photo-edit"){ $("dlg-photo").close(); openProfile(); }
  else if(a==="logout"){ logout(el); }
  else if(a==="sync-now"){ syncNow(true); }
  else if(a==="del-photo"){ pendingPhoto=""; el.hidden=true; }
  else if(a==="quotes"){ setProfile({quotes:(S.profile||{}).quotes===false}); render(); }
  else if(a==="go"){ location.hash = el.dataset.v; window.scrollTo(0,0); }
  else if(a==="set"){ var o={}, sv=el.dataset.v; o[el.dataset.k] = sv==="true" ? true : sv==="false" ? false : sv; setProfile(o); render(); }
  else if(a==="font"){ setProfile({font:el.dataset.v}); render(); }
  else if(a==="accent"){ setProfile({accent:el.dataset.v}); render(); }
  else if(a==="snooze-backup"){ setProfile({backupSnooze:today()}); render(); }
  else if(a==="share-backup"){ shareBackup(); }
  else if(a==="copy-backup"){
    var txt = backupText();
    var fail = function(){ $("bk-text").value=txt; $("bk-err").hidden=true; restoreArmed=false; $("bk-go").textContent="Reemplazar mis datos"; $("dlg-restore").showModal(); $("bk-text").select(); S.bkMsg="No se pudo copiar automáticamente: copia el texto del cuadro."; render(); };
    try{ navigator.clipboard.writeText(txt).then(function(){ markBackup(); S.bkMsg="Respaldo copiado. Pégalo en tus notas para guardarlo."; render(); }, fail); }catch(e){ fail(); }
  }
  else if(a==="open-restore"){ restoreArmed=false; $("bk-text").value=""; $("bk-file").value=""; $("bk-err").hidden=true; $("bk-go").textContent="Reemplazar mis datos"; $("dlg-restore").showModal(); }
});

/* ---------- self update ---------- */
function checkUpdate(){
  if(!LOCAL) return;
  fetch("version.json?"+Date.now(), {cache:"no-store"}).then(function(r){ return r.json(); }).then(function(j){
    if(!j || !j.v || j.v===VERSION) return;
    if(location.search.indexOf("v="+j.v)>=0) return;
    if(document.querySelector("dialog[open]")) return;
    location.replace(location.pathname+"?v="+encodeURIComponent(j.v)+location.hash);
  }).catch(function(){});
}
document.addEventListener("visibilitychange", function(){ if(document.visibilityState==="visible") checkUpdate(); });
/* ---------- start ---------- */
function start(){
  if(LOCAL){
    loadLocal();
    try{ navigator.storage && navigator.storage.persist && navigator.storage.persist(); }catch(e){}
    route(); processParams(); startSync(); initPush(); checkUpdate(); return;
  }
  route();
  var slow = setTimeout(function(){
    S.note = S.cfgLoaded ? "No se pudo confirmar con el guardado; lo que ves puede estar desactualizado." : "Aún no se pueden leer tus datos guardados. Se mostrarán en cuanto haya conexión.";
    render();
  }, 10000);
  var settle = function(){ clearTimeout(slow); S.note=""; };
  window.claude.use("db").then(function(d){
    if(!d){ offline(slow); return; }
    db=d; cfgRef=db.doc("app/config"); daysCol=db.collection("days");
    var onErr = function(){ settle(); S.cfgLoaded=true; S.note="Se perdió la conexión con el guardado. Vuelve a abrir la app para seguir registrando."; render(); };
    cfgRef.onSnapshot(function(snap){
      if(!pending("cfg")){
        var data = snap.exists ? snap.data() : null;
        S.habits = data && Array.isArray(data.habits) ? clone(data.habits) : [];
        S.profile = data && data.profile && typeof data.profile==="object" ? clone(data.profile) : {};
      }
      S.cfgLoaded = true;
      if(!snap.metadata || !snap.metadata.fromCache){ settle(); processParams(); }
      render();
    }, onErr);
    daysCol.onSnapshot(function(qs){
      qs.docs.forEach(function(doc){
        if(pending("d:"+doc.id)) return;
        var data = doc.data();
        S.days[doc.id] = data && data.v ? clone(data.v) : {};
      });
      render();
    }, onErr);
  }, function(){ offline(slow); });
}
function offline(slow){
  clearTimeout(slow);
  S.cfgLoaded = true;
  S.note = "El guardado no está disponible en esta vista. Puedes probar la app, pero los cambios no se conservarán.";
  render();
}
start();
})();
